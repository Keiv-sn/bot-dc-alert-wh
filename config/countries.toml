# Configuracion de los paises monitoreados (decision D1 y arquitectura de
# docs/PLAN.md). Agregar un pais nuevo = agregar un bloque [paises.X].
#
# Claves:
#   nombre           : nombre para mostrar (mensajes de Discord)
#   url              : fuente oficial primaria
#   url_respaldo     : fuente oficial alternativa si la primaria bloquea (opcional)
#   acceso           : "http" (httpx, por defecto) | "navegador" (Chromium/Playwright
#                      para fuentes con WAF: Incapsula de NZ, .go.jp, canada.ca)
#   metodo           : extraccion -> "texto" | "fila" | "selector"
#   ancla            : solo metodo "fila" — texto contenido en la fila a extraer
#   selector         : solo metodo "selector" — CSS del elemento de estado
#   keywords_abierto : señales (minúsculas) de convocatoria ABIERTA
#   keywords_cerrado : señales (minúsculas) de convocatoria CERRADA
#   contexto         : D10 anti-noticia — la keyword solo cuenta si co-ocurre
#                      con esta palabra (p. ej. "chile") en una ventana de
#                      ~250 caracteres. Vacío = sin exigencia (opcional)
#   selector_seccion : D10 anti-ruido — con metodo "texto", extrae solo esta
#                      sección (p. ej. "main"), sin menús ni navegación
#
# keywords vacias = pais aun en verificacion: el motor de deteccion lo trata
# por deteccion de cambios, no por keywords (refinar al validar la fuente).

# D10: parametros de mensajeria (PLAN §8). Los webhooks NUNCA viven aqui:
# son variables de entorno (DISCORD_WEBHOOK_URL = canal publico de comunidad,
# DISCORD_WEBHOOK_ADMIN_URL = canal de staff).
[alertas]
cooldown_horas = 24        # no re-alertar el mismo pais+tipo antes de esto
max_embeds_corrida = 3     # tope anti-saturacion por corrida
digest_horas = 24          # embed de estado a admin cada N horas (0 = apagado)

[paises.au]
nombre = "Australia 🇦🇺"
url = "https://immi.homeaffairs.gov.au/what-we-do/whm-program/status-of-country-caps"
metodo = "fila"
ancla = "Chile"
keywords_abierto = ["open"]
keywords_cerrado = ["closed", "check ballot"]

[paises.ca]
nombre = "Canadá 🇨🇦"
url = "https://www.canada.ca/en/immigration-refugees-citizenship/services/work-canada/iec/become-candidate.html"
acceso = "navegador"  # canada.ca bloquea clientes HTTP desde red chilena (Etapa 3)
metodo = "texto"
selector_seccion = "main"  # D10: sin menus, menos falsos CAMBIO
# El banner de temporada cambia explicitamente: "season is closed" -> "season is open"
# cuando las rondas empiezan (verificado live 2026-11-10)
keywords_abierto = ["season is open"]
keywords_cerrado = ["season is closed"]

[paises.ie]
nombre = "Irlanda 🇮🇪"
url = "https://www.ireland.ie/en/chile/santiago/services/visas/chile-working-holiday-agreement/"
metodo = "texto"
selector_seccion = "main"  # D10: sin menus, menos falsos CAMBIO
contexto = "chile"  # D10: noticias de otros programas no disparan apertura
# Esquema anual: 200 cupos (2 rondas de 100), 18-30 anos, postulacion por
# UN e-mail a irishwhchile@vfsglobal.com en las fechas anunciadas.
# Reverificado 2026-11-16 (Kevin): las fechas se anuncian por Instagram
# (@irlembchile) y en la seccion de noticias de la embajada — verificada
# hoy: vacia en HTML estatico (JavaScript), no monitoreable. Las keywords
# anticipan la frase de ronda abierta; se validan contra el texto real
# cuando aparezca (patron fr/kr).
keywords_abierto = ["are now open", "round is open"]
keywords_cerrado = []

[paises.nz]
nombre = "Nueva Zelanda 🇳🇿"
url = "https://www.immigration.govt.nz/visas/chile-working-holiday-visa/"
acceso = "navegador"  # WAF Incapsula: requiere navegador real (Etapa 3)
metodo = "selector"
selector = ".visa-page__status-wrapper"
keywords_abierto = ["open for"]
keywords_cerrado = ["closed for"]

[paises.jp]
nombre = "Japón 🇯🇵"
url = "https://www.cl.emb-japan.go.jp/itpr_es/WorkingHolidayChileJapon.html"
url_respaldo = "https://www.mofa.go.jp/mofaj/toko/working/index.html"
acceso = "navegador"  # WAF por huella TLS en .go.jp (Etapa 3)
metodo = "texto"
keywords_abierto = ["apertura del agendamiento", "convocatoria abierta"]
keywords_cerrado = []

# ---- Paises agregados 2026-11-14 (fuentes verificadas en vivo) ----
# Fuente madre de la vigencia de acuerdos: consulado.gob.cl/servicios/acuerdos-working-holiday

[paises.de]
nombre = "Alemania 🇩🇪"
url = "https://santiago.diplo.de/cl-es/service/05-visaeinreise/1210626-1210626"
acceso = "http"  # diplo.de responde 200 a httpx (verificado live 2026-11-14)
metodo = "texto"
selector_seccion = "main"
# Programa de citas todo el ano: sin estado abierto/cerrado. El valor esta en
# los CAMBIOS (arancel 75 euros, financiamiento 1.326 euros, requisitos).
# Reverificado 2026-11-16 (Kevin): misma pagina, sin senal de estado; queda
# desconocido-solo-cambio por diseño.
keywords_abierto = []
keywords_cerrado = []

[paises.fr]
nombre = "Francia 🇫🇷"
url = "https://cl.diplomatie.gouv.fr/fr/aller-en-france/campagne-visa-vacances-travail-2026"
acceso = "http"  # 200 a httpx (verificado live 2026-11-15)
metodo = "texto"
selector_seccion = "main"
# Campana ANUAL con cupo 400: pagina de campana que declara su estado.
# Se monitorea la version FR (la maestra): "Mis a jour le 22 octobre 2026"
# vs la ES "Actualizado el 24 de June de 2026" (traduccion rezagada).
# 2026-11-15: "Les candidatures pour la campagne 2026 sont actuellement
# fermees." Al reabrir (2027), se valida la keyword de apertura contra el
# texto real y se agrega a keywords_abierto.
keywords_abierto = []
keywords_cerrado = ["actuellement fermées"]

[paises.kr]
nombre = "Corea del Sur 🇰🇷"
url = "https://overseas.mofa.go.kr/cl-es/brd/m_22556/list.do"
acceso = "navegador"  # familia .go.kr (misma infraestructura WAF que .go.jp)
metodo = "texto"
# Tablero oficial "Asuntos Consulares/Visado > Working Holiday" de la
# embajada (elegido sobre la portada: esta tenia reloj en vivo, carruseles
# e Instagram que disparaban CAMBIO sin senal). El tablero cambio
# 2026-11-04: "1ra Convocatoria Working Holiday 2027" con
# "(CUPOS AGOTADOS)". keyword de apertura se validara cuando haya
# convocatoria nueva sin el prefijo de agotado.
keywords_abierto = []
keywords_cerrado = ["cupos agotados"]

[paises.dk]
nombre = "Dinamarca 🇩🇰"
url = "https://nyidanmark.dk/en-GB/Applying/Working-Holiday/Working-Holiday-Chile-application"
url_respaldo = "http://chile.um.dk/es/servicios-consulares/visa-y-permiso-de-residencia/working-holiday/"
acceso = "http"  # 200 a httpx (verificado live 2026-11-16; el 15 Kevin la vio caida en su navegador, pero el bot la lee bien)
metodo = "texto"
selector_seccion = "main"  # <main> existe (17.9k de 18.4k chars) y CONTIENE el news
# SIRI: cuota anual de 150 (2 periodos: marzo-agosto 75 / septiembre-febrero
# hasta 150), por orden de llegada. La propia pagina trae "Relevant news":
# 2026-11-16: "The Working Holiday quotas for citizens of Chile and Argentina
# have opened" (01-09-2026) -> CUOTA ABIERTA (2do periodo). keyword "have
# opened" con contexto "chile" (coocurren en el titulo del news, verificado).
# Riesgo conocido (mismo patron que Corea): el news persiste aunque el cupo se
# llene; el cierre publicara otro news -> CAMBIO -> refinar keywords_cerrado
# contra el texto real. NO usar "when the quota is full": es frase estatica de
# la guia de la pagina (crearia un falso cerrado).
keywords_abierto = ["have opened"]
keywords_cerrado = []
contexto = "chile"

[paises.se]
nombre = "Suecia 🇸🇪"
url = "https://www.consulado.gob.cl/workingholiday/suecia"
acceso = "http"  # gob.cl responde 200 a httpx (verificado live 2026-11-14)
metodo = "texto"
# ACUERDO TEMPORALMENTE SUSPENDIDO segun la fuente oficial chilena
# ("Este acuerdo se encuentra temporalmente suspendido."). Cuando cese la
# suspension, la frase desaparece -> CAMBIO -> refinar keywords de apertura.
keywords_abierto = []
keywords_cerrado = ["suspendido"]

[paises.pt]
