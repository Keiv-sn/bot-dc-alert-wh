url_respaldo = "https://www.consulado.gob.cl/workingholiday/portugal"
acceso = "http"  # 200 a httpx (verificado live 2026-11-15)
metodo = "texto"
selector_seccion = "main"
# Fuente AUTORITATIVA: la embajada de Portugal en Chile (el pais que otorga
# la visa) publica aqui la informacion del programa (nota 2017: "el numero
# de visas es ilimitado"). Cambios/nuevas notas = senal real. La pagina del
# Consulado chileno queda de respaldo.
keywords_abierto = []
keywords_cerrado = []

[paises.is]
nombre = "Islandia 🇮🇸"
url = "https://island.is/en/permit-for-working-holiday"
acceso = "http"  # 200 a httpx (verificado live 2026-11-14)
metodo = "texto"
selector_seccion = "main"
# Permiso de residencia WH/Youth Mobility (Chile incluido en el acuerdo;
# arancel 40.000 ISK). Postulacion todo el ano por correo: seguimiento por CAMBIO.
keywords_abierto = []
keywords_cerrado = []

[paises.ch]
nombre = "Suiza 🇨🇭"
url = "https://www.consulado.gob.cl/workingholiday/suiza"
acceso = "http"  # gob.cl responde 200 a httpx (verificado live 2026-11-14)
metodo = "texto"
# ATENCION: NO es Working Holiday clasico — es "Intercambio de pasantes"
# (pasantia de hasta 18 meses, 18-35 anos, requiere titulo profesional).
# Postulacion por cita (santiago.visas@eda.admin.ch). Monitoreo por CAMBIO.
# Reverificado 2026-11-16 (Kevin): la pagina de cuotas del SEM no aplica a
