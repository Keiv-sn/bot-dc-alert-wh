# Configuracion de los paises monitoreados (decision D1 y arquitectura de
# docs/PLAN.md). Agregar un pais nuevo = agregar un bloque [paises.X].
#
# Claves:
#   nombre           : nombre para mostrar (mensajes de Discord)
#   url              : fuente oficial primaria
#   url_respaldo     : fuente oficial alternativa si la primaria bloquea (opcional)
#   acceso           : "http" (httpx, por defecto) | "navegador" (Chromium/Playwright
#                      para fuentes con WAF: Incapsula de NZ, .go.jp, canada.ca)
#   metodo           : extraccion -> "texto" | "fila" | "selector"
#   ancla            : solo metodo "fila" — texto contenido en la fila a extraer
#   selector         : solo metodo "selector" — CSS del elemento de estado
#   keywords_abierto : señales (minúsculas) de convocatoria ABIERTA
#   keywords_cerrado : señales (minúsculas) de convocatoria CERRADA
#   contexto         : D10 anti-noticia — la keyword solo cuenta si co-ocurre
#                      con esta palabra (p. ej. "chile") en una ventana de
#                      ~250 caracteres. Vacío = sin exigencia (opcional)
#   selector_seccion : D10 anti-ruido — con metodo "texto", extrae solo esta
#                      sección (p. ej. "main"), sin menús ni navegación
#
# keywords vacias = pais aun en verificacion: el motor de deteccion lo trata
# por deteccion de cambios, no por keywords (refinar al validar la fuente).

# D10: parametros de mensajeria (PLAN §8). Los webhooks NUNCA viven aqui:
# son variables de entorno (DISCORD_WEBHOOK_URL = canal publico de comunidad,
# DISCORD_WEBHOOK_ADMIN_URL = canal de staff).
[alertas]
cooldown_horas = 24        # no re-alertar el mismo pais+tipo antes de esto
max_embeds_corrida = 3     # tope anti-saturacion por corrida

[paises.au]
nombre = "Australia 🇦🇺"
url = "https://immi.homeaffairs.gov.au/what-we-do/whm-program/status-of-country-caps"
metodo = "fila"
ancla = "Chile"
keywords_abierto = ["open"]
keywords_cerrado = ["closed", "check ballot"]

[paises.ca]
nombre = "Canadá 🇨🇦"
url = "https://www.canada.ca/en/immigration-refugees-citizenship/services/work-canada/iec/become-candidate.html"
acceso = "navegador"  # canada.ca bloquea clientes HTTP desde red chilena (Etapa 3)
metodo = "texto"
selector_seccion = "main"  # D10: sin menus, menos falsos CAMBIO
# El banner de temporada cambia explicitamente: "season is closed" -> "season is open"
# cuando las rondas empiezan (verificado live 2026-11-10)
keywords_abierto = ["season is open"]
keywords_cerrado = ["season is closed"]

[paises.ie]
nombre = "Irlanda 🇮🇪"
url = "https://www.ireland.ie/en/chile/santiago/services/visas/chile-working-holiday-agreement/"
metodo = "texto"
selector_seccion = "main"  # D10: sin menus, menos falsos CAMBIO
contexto = "chile"  # D10: noticias de otros programas no disparan apertura
keywords_abierto = ["are now open", "round is open"]
keywords_cerrado = []

[paises.nz]
nombre = "Nueva Zelanda 🇳🇿"
url = "https://www.immigration.govt.nz/visas/chile-working-holiday-visa/"
acceso = "navegador"  # WAF Incapsula: requiere navegador real (Etapa 3)
metodo = "selector"
selector = ".visa-page__status-wrapper"
keywords_abierto = ["open for"]
keywords_cerrado = ["closed for"]

[paises.jp]
nombre = "Japón 🇯🇵"
url = "https://www.cl.emb-japan.go.jp/itpr_es/WorkingHolidayChileJapon.html"
url_respaldo = "https://www.mofa.go.jp/mofaj/toko/working/index.html"
acceso = "navegador"  # WAF por huella TLS en .go.jp (Etapa 3)
metodo = "texto"
keywords_abierto = ["apertura del agendamiento", "convocatoria abierta"]
keywords_cerrado = []

